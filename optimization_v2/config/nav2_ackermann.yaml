controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    odom_topic: /s05/odometry
    enable_stamped_cmd_vel: false
    progress_checker_plugins:
    - progress
    goal_checker_plugins:
    - goal
    controller_plugins:
    - RPP
    - MPPI
    progress:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 20.0
    goal:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.1
      stateful: true
    DWB:
      plugin: s13::MeasuredController
      implementation: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.12
      max_vel_y: 0.0
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.12
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 21
      sim_time: 3.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.15
      xy_goal_tolerance: 0.06
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      RotateToGoal:
        scale: 20.0
        slowing_factor: 5.0
        lookahead_time: 1.0
      BaseObstacle:
        scale: 0.02
      PathAlign:
        scale: 24.0
        forward_point_distance: 0.1
      GoalAlign:
        scale: 16.0
        forward_point_distance: 0.1
      PathDist:
        scale: 24.0
      GoalDist:
        scale: 16.0
    RPP:
      plugin: s13::MeasuredController
      implementation: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.12
      lookahead_dist: 0.45
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.7
      lookahead_time: 3.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.15
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 2.11
      regulated_linear_scaling_min_speed: 0.02
      use_rotate_to_heading: false
      allow_reversing: false
      max_angular_accel: 0.8
      max_robot_pose_search_dist: 8.0
    MPPI:
      plugin: s13::MeasuredController
      implementation: nav2_mppi_controller::MPPIController
      time_steps: 50
      model_dt: 0.1
      batch_size: 750
      iteration_count: 2
      vx_std: 0.05
      vy_std: 0.0
      wz_std: 0.02
      vx_max: 0.12
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.05687203791469195
      ax_max: 0.5
      ax_min: -0.8
      ay_max: 0.0
      az_max: 0.8
      prune_distance: 3.0
      transform_tolerance: 0.15
      temperature: 0.1
      gamma: 1.0e-05
      motion_model: Ackermann
      visualize: false
      regenerate_noises: false
      reset_period: 1.0
      retry_attempt_limit: 1
      AckermannConstraints:
        min_turning_r: 2.11
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.3
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        critical_cost: 253.0
        collision_cost: 1000000.0
        near_goal_distance: 0.3
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 0.6
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 40.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.15
        offset_from_furthest: 2
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 80.0
        offset_from_furthest: 6
        threshold_to_consider: 0.15
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 2
        threshold_to_consider: 0.15
        max_angle_to_furthest: 0.12
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.2
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: s13::StaticMapPlanner
      tolerance: 0.05
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /s05/odometry
    bt_loop_duration: 20
    default_server_timeout: 1000
    wait_for_service_timeout: 2000
    default_nav_to_pose_bt_xml: /home/ceihao/robot_project/optimization_v2/ws/src/navigation_adapter/config/navigate.xml
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    transform_tolerance: 0.15
    filter_duration: 0.3
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.025
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: '[[-0.3, -0.52], [1.3, -0.52], [1.3, 0.52], [-0.3, 0.52]]'
      plugins:
      - observed
      - inflation
      observed:
        plugin: s09::ObservedRiskLayer
        topic: /s13/risk/ackermann
        max_age: 0.6
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.6
        cost_scaling_factor: 4.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: '[[-0.3, -0.52], [1.3, -0.52], [1.3, 0.52], [-0.3, 0.52]]'
      plugins:
      - observed
      - inflation
      observed:
        plugin: s09::ObservedRiskLayer
        topic: /s13/risk_map/ackermann
        max_age: 0.6
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.6
        cost_scaling_factor: 4.0
