<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人作业监视</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101925;color:#edf4f8;font:16px system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:28px}h1{font-size:30px;margin:4px 0}h2{font-size:18px;margin:0 0 14px;color:#bdd5e5}.sub{color:#a6bbc9;font-size:14px}#banner{padding:22px;border-left:5px solid #5cc9a3;background:#1c3040;margin:22px 0;font-size:24px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.card{background:#192738;border:1px solid #2d4056;border-radius:10px;padding:20px;margin-bottom:18px}.row{display:flex;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px solid #2c3b4d}.val{font-family:ui-monospace,monospace;text-align:right;overflow-wrap:anywhere;max-width:66%}canvas{width:100%;height:320px;background:#111d2a;border-radius:6px}#reason{font-size:16px;margin-top:8px;overflow-wrap:anywhere}ol{line-height:1.9;padding-left:22px}.alert{color:#ffce91}.small{font-size:13px;color:#9cb4c6}#stale{color:#ffce91;min-height:24px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style><main><div class="sub">ROS 2 · Gazebo · Nav2 · 可解释行为树</div><h1>机器人作业监视</h1><div id="scope" class="sub"></div><div id="stale"></div><div id="banner"><b id="status">等待运行数据</b><div id="reason"></div></div><div class="grid"><div><section class="card"><h2>执行位置与当前目标 · map 坐标</h2><canvas id="map" width="760" height="380"></canvas><div class="small">蓝线：估计定位轨迹；绿色：当前机器人；橙色：当前目标。仅用于监视，不控制车辆。</div></section><section class="card"><h2>作业进度与工具账本</h2><div id="progress"></div></section></div><div><section class="card"><h2>异常诊断</h2><div id="diagnosis"></div></section><section class="card"><h2>定位、感知与停车确认</h2><div id="health"></div></section><section id="handoff" class="card" hidden><h2 class="alert">需要人工检查 · 自动重试已终止</h2><ol><li>查看障碍物、剩余空间与当前目标。</li><li>核对定位、传感器时间和地图版本。</li><li>确认车辆与工具均已停止。</li><li>处理故障后，显式启动恢复流程；保留未完成账本。</li></ol><div class="small">页面没有解除停车或强制执行按钮。</div></section></div></div><footer id="run" class="small"></footer></main>
<script>
const labels={READY:'等待任务准入',NAVIGATING:'正在行驶',WORKING:'正在作业',WAITING_OR_REPLANNING:'停车等待 / 重新规划',MANUAL_CHECK_REQUIRED:'需要人工检查',COMPLETED:'本次任务完成'};
const diagLabels={REFERENCE_OR_MAP_NOT_VALID:'地图或定位尚不满足诊断条件',NO_CURRENT_GOAL:'暂无当前目标',GOAL_OUTSIDE_OBSERVED_WINDOW:'目标在当前观测窗口以外',OBSERVED_GRID_DISCONNECTED:'当前准入栅格不连通（不证明真实世界永久无路）',POINT_CONNECTED_KINEMATICS_UNRESOLVED:'点可达；车辆转弯与完整轮廓路径仍未解决',NOT_REQUESTED:'尚无持续阻塞'};
const $=id=>document.getElementById(id);let trail=[],lastRun='',lastT=-1;
function rows(id,values){const root=$(id);root.replaceChildren();for(const[k,v]of values){const r=document.createElement('div');r.className='row';const a=document.createElement('span'),b=document.createElement('span');a.textContent=k;b.className='val';b.textContent=v??'—';r.append(a,b);root.append(r)}}
function draw(m){const c=$('map'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const pts=[...trail];if(m.goal_map)pts.push(m.goal_map);if(!pts.length)return;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),lo=[Math.min(...xs)-2,Math.min(...ys)-2],hi=[Math.max(...xs)+2,Math.max(...ys)+2],s=Math.min((c.width-60)/(hi[0]-lo[0]),(c.height-60)/(hi[1]-lo[1]));const p=v=>[30+(v[0]-lo[0])*s,c.height-30-(v[1]-lo[1])*s];x.strokeStyle='#30516b';x.lineWidth=1;for(let i=0;i<11;i++){x.beginPath();x.moveTo(30+i*(c.width-60)/10,20);x.lineTo(30+i*(c.width-60)/10,c.height-20);x.stroke()}x.beginPath();trail.forEach((v,i)=>{const[a,b]=p(v);i?x.lineTo(a,b):x.moveTo(a,b)});x.strokeStyle='#6eb7ec';x.lineWidth=3;x.stroke();for(const[v,color]of [[m.position_map,'#60dfac'],[m.goal_map,'#ffbc74']]){if(!v)continue;const[a,b]=p(v);x.fillStyle=color;x.beginPath();x.arc(a,b,7,0,2*Math.PI);x.fill();x.font='13px monospace';x.fillText(v.map(n=>n.toFixed(2)).join(', '),a+10,b-10)}}
const reasonLabels={BLOCK_RETRY_EXHAUSTED:'恢复等待超时或重试额度用尽，需要人工检查',ABSOLUTE_HEADING_EXPIRED:'绝对航向观测已过期',SUPERVISOR_NO_PROGRESS_60S_MANUAL_CHECK:'连续60秒没有运动进展，停车并请求人工检查',NEXT_OBLIGATION:'继续当前未完成任务',GLOBAL_REPLAN:'根据当前观测重新计算路径',SHORT_OBSTRUCTION_WAIT:'保护条件触发，先停车等待',OBSERVATION_RECOVERY_WAIT:'等待合格观测与稳定恢复',INPUT_STALE:'输入数据过期，保持停车',SENSOR_ADMISSION_WAIT:'等待传感器准入',SAFETY_STOP:'安全条件不满足，停止任务',BUDGET_STOP:'剩余时间不足，保存未完成任务',WALL_BUDGET_STOP:'达到本轮墙钟时间上限，保留剩余任务',FEEDBACK_COMPLETE:'实际反馈满足完成要求'};
function explain(code){return code?(reasonLabels[code]?reasonLabels[code]+'（'+code+'）':code):'—'}
async function update(){try{const r=await fetch('/state');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),m=d.monitor; $('scope').textContent=d.scope;$('run').textContent=d.run;if(!m){$('status').textContent='等待运行数据';$('reason').textContent='';$('handoff').hidden=true;for(const id of ['progress','diagnosis','health'])rows(id,[]);$('map').getContext('2d').clearRect(0,0,760,380);trail=[];$('stale').textContent='尚未收到监视数据，不能据此判断车辆状态。';return}if(d.run!==lastRun||m.t<lastT)trail=[];lastRun=d.run;lastT=m.t;if(m.position_map&&(!trail.length||Math.hypot(...m.position_map.map((v,i)=>v-trail.at(-1)[i]))>.03))trail.push(m.position_map);if(trail.length>10000)trail.shift();const endedWithoutTerminal=!!d.metrics&&!m.terminal;$('status').textContent=endedWithoutTerminal?'执行已结束 · 请检查最终结果':(labels[m.state]||m.state);$('reason').textContent=explain(endedWithoutTerminal?d.metrics.reason:(m.reason||m.bt_reason));$('banner').style.borderColor=(m.requires_manual||endedWithoutTerminal&&!d.metrics.complete)?'#ffad74':'#5cc9a3';$('stale').textContent=endedWithoutTerminal?'执行已结束；最后监视快照不是最终停车证明，请核对验收与运行退出记录。':m.terminal?'运行已结束：以下为归档结果。':d.update_age_wall_s>5?'数据更新已中断：这是最后一次状态，不能认定车辆仍正常运行。':'';$('handoff').hidden=!(m.requires_manual||endedWithoutTerminal&&!d.metrics.complete);const job=d.mission||{};rows('progress',[['仿真时间',m.t.toFixed(1)+' s'],['当前动作',m.job],['已完成 / 剩余动作',m.completed_jobs+' / '+m.remaining_jobs],['确认点服务',job.confirmed_points!==undefined?job.confirmed_points+' / '+job.required_points:'—'],['确认覆盖率',job.coverage_fraction!=null?(100*job.coverage_fraction).toFixed(1)+'%':'—'],['工具反馈',m.tool.phase],['工具已关闭',m.tool.stopped_confirmed?'是':'待确认']]);rows('diagnosis',[['路径诊断',diagLabels[m.route_diagnosis.code]||m.route_diagnosis.code],['未进展时间',(m.progress.stalled_s||0).toFixed(1)+' s'],['当前恢复窗口重规划',m.replans],['延后次数',m.deferrals],['BT 原因',explain(m.bt_reason)]]);rows('health',[['定位',m.localization.state],['定位原因',explain(m.localization.reason)],['感知几何新鲜',m.perception.fresh?'是':'否'],['实测速度',m.vehicle.v!=null?m.vehicle.v.toFixed(4)+' m/s':'—'],[endedWithoutTerminal?'最后快照停车反馈（非最终证明）':'车辆 + 工具安全停止',m.stop_confirmed?'已确认':'未确认'],['运动门控原因',m.vehicle.reason]]);draw(m)}catch(e){$('stale').textContent='监视连接中断：'+e.message}}
update();setInterval(update,1000);
</script></html>
