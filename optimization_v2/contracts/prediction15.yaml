  PREDICTION_STALE_FALLBACK: 预测过期，退回原当前观测安全基线
  PREDICTION_TRANSPORT_FALLBACK: 推理通道失联，退回原当前观测安全基线
  PREDICTION_UNCERTAINTY_FALLBACK: 预测协方差过大，不用该目标预测解除原安全条件
  PREDICTION_WAIT_EXHAUSTED: 原等待或合计恢复预算耗尽，保存残余后停止
