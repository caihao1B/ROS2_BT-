dynamic_obstacles:
  ros__parameters:
    scenario: agri_suite
    mode: low
    seed: 303
    bounds_source: plan
    bbox: [0.0, 0.0, 10.0, 10.0]
    edge_margin_m: 0.15

    startup_wait_sec: 4.0
    cleanup_before_spawn: true
    safe_spawn_enable: true
    safe_spawn_arm_delay_sec: 1.5
    safe_spawn_pose_timeout_sec: 8.0
    safe_spawn_robot_clearance_m: 0.85
    safe_spawn_front_clearance_m: 1.10
    safe_spawn_front_half_angle_deg: 70.0
    safe_spawn_outside_pad_m: 0.60

    obstacle_name_prefix: "smallS3"
    obstacle_mass: 1.0
    obstacle_kinematic: true
    spawn_z: 0.0
    obstacle_speed_mps: 0.24
    update_rate_hz: 10.0

    suite_segment_indices: [0, 1, 2, 3]

    agri_crossing_num: 1
    agri_parallel_num: 1
    agri_blocking_num: 1
    agri_random_walk_num: 0

    agri_crossing_speed_scale: 1.0
    agri_parallel_speed_scale: 0.45
    agri_blocking_speed_scale: 0.80

    agri_block_leave: true
    agri_block_dwell_min_sec: 6.0
    agri_block_dwell_max_sec: 12.0
    agri_outside_pause_min_sec: 0.6
    agri_outside_pause_max_sec: 1.5
    agri_initial_delay_max_sec: 2.0

    agri_size_profiles: ["small", "human"]
    agri_size_weights: [4.0, 1.0]
    size_small_xyz: [0.18, 0.18, 0.28]
    size_human_xyz: [0.35, 0.35, 0.70]
    size_vehicle_xyz: [1.50, 1.00, 0.90]

    enable_wiggle: true
    wiggle_amp_m_range: [0.00, 0.03]
    wiggle_freq_hz_range: [0.00, 0.25]
    gaussian_noise_std_m: 0.005
