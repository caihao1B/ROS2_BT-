coverage_bt_supervisor:
  ros__parameters:
    decision_topic: /coverage/strategy_decision
    current_path_topic: /coverage/current_path
    follow_action: /follow_path
    compute_path_action: /compute_path_to_pose
    navigate_action: /navigate_to_pose
    robot_base_frame: base_link
    use_latest_tf: true

    use_d12_advisors: false
    region_state_topic: /coverage/region_state/summary
    recovery_event_topic: /coverage/recovery_event
    d1_service: /coverage/d1_advisor/evaluate
    d2_service: /coverage/d2_advisor/replan
    d12_rpc_timeout_sec: 3.5
    d1_score_threshold: 4.0
    d2_score_threshold: 3.0
    d2_enable: false
    d2_candidate_limit: 4
    d2_blocked_zone_pad_m: 0.08
    d2_blocked_zone_radius_cap_m: 0.50
    d_plan_bbox_pad_m: 0.25
    d_bypass_c_if_region_hard: true

    wait_clear_hold_sec: 0.6
    wait_max_sec: 8.0
    defer_max_times: 2
    replan_max_times: 3

    tracks_topic: /coverage/obstacles/tracks
    predictions_topic: /coverage/obstacles/predictions
    costmap_topic: /local_costmap/costmap_raw
    cmd_vel_topic: /cmd_vel
    clear_local_service: /local_costmap/clear_entirely_local_costmap
    clear_global_service: /global_costmap/clear_entirely_global_costmap
    clear_service_timeout_sec: 0.8
    stale_shadow_cleanup_enable: true
    stale_shadow_no_live_sec: 0.6
    stale_shadow_clear_cooldown_sec: 2.0
    require_live_evidence_for_blocking_modes: true
    action_watchdog_enable: true
    action_watchdog_grace_sec: 5.0
    action_watchdog_timeout_sec: 15.0
    action_watchdog_min_progress_m: 0.08
    action_watchdog_segment_max_sec: 45.0

    robot_radius_m: 0.22
    enable_trim_on_segment_start: true
    min_remaining_poses_after_trim: 2
    cluster_strict_defer: true
    defer_cooldown_sec: 10.0
    skip_after_failures: 4

    c_enable_slice: true
    c_corridor_radius_m: 0.70
    c_skip_margin_m: 0.40
    c_rejoin_min_ahead_m: 0.90
    c_rejoin_step_m: 0.35
    c_rejoin_max_trials: 6
    c_max_attempts_per_segment: 2
    c_allow_rejoin_next_segment: true
    c_revisit_origin_on_rejoin_next_segment: false
    c2_enable_ordered_exit_rejoin: true
    c2_next_segment_points_per_segment: 4
    c2_next_segment_step_m: 0.25
    c2_next_segment_start_offset_m: 0.00
    c2_turn_use_next_queue_segment: true
    c2_allow_ordered_fallback_without_cluster: true
    d_turn_try_c2_before_defer: true

    d_enable_cluster_recovery: false
    d_candidate_max_segments: 2
    d_cluster_jump_sort: queue
    d_max_attempts_per_segment: 3
    jump_limit_enable: true
    jump_limit_max_segment_delta: 2
    jump_limit_max_linear_m: 2.5
    main_pass_revisit_window_segments: 1
    main_pass_revisit_window_m: 2.5
    main_pass_cleanup_far_deferred: true
    d_fallback_rejoin_min_ahead_m: 0.25
    d_fallback_rejoin_step_m: 0.20
    d_fallback_rejoin_max_trials: 4

    observe_enable: true
    observe_spin_rad: 6.283185307179586
    observe_angular_vel: 0.60
    observe_backup_sec: 1.0
    detour_watchdog_min_progress_m: 0.08
    detour_watchdog_timeout_sec: 12.0
    detour_watchdog_grace_sec: 4.0
    detour_watchdog_enable: true
    detour_delay_compute_sec: 0.20
    detour_stop_hold_sec: 0.35
    observe_backup_vel: -0.08
    observe_settle_sec: 0.60
    observe_side_step_enable: false
    observe_side_step_dist_m: 0.25

    costmap_max_age_sec: 2.0
    costmap_unknown_bad_frac: 0.30
    costmap_min_obstacle_frac: 0.002

    cleanup_log_path: ~/.ros/coverage_cleanup_todo.jsonl
    speed_limit_topic: /speed_limit
    turn_segment_enable_speed_limit: true
    turn_segment_speed_limit_ratio: 0.35
    turn_prealign_enable: true
    turn_prealign_heading_error_rad: 0.90
    turn_prealign_yaw_tolerance_rad: 0.18
    turn_prealign_angular_vel: 0.85
    turn_prealign_timeout_sec: 6.0
    turn_prealign_timeout_continue_if_err_below_rad: 0.35

    abort_use_d_replan_first: false
    abort_use_c_recovery_first: true
    abort_replan_cooldown_sec: 6.0
    abort_c_escalate_after_failures: 2
    abort_short_segment_length_m: 1.20
    abort_turn_prefer_c2: true
    abort_cluster_jump_after_failures: 2

    tiny_residual_ignore_enable: true
    tiny_residual_length_m: 0.20
    tiny_residual_turn_length_m: 0.35
    endgame_finish_enable: true
    endgame_remaining_segments_le: 1
    endgame_close_remaining_m: 0.50

    c_prebackup_enable: true
    c_prebackup_if_candidates_le: 2
    c_prebackup_obs_dist_m: 0.60
    c_prebackup_obs_ahead_m: 1.00
    c_prebackup_backup_sec: 0.60
    c_prebackup_backup_vel: -0.08
    c_prebackup_settle_sec: 0.35
    c_detour_max_length_m: 3.5
    c2_detour_max_length_m: 5.0
    c_detour_max_stretch_ratio: 3.0
    c_detour_max_initial_backtrack_m: 0.30
    c_dynamic_refresh_enable: true
    c_dynamic_refresh_no_progress_sec: 5.0
    c_dynamic_refresh_cooldown_sec: 4.0
    c_dynamic_refresh_max_per_candidate: 1
    c_dynamic_refresh_backup_sec: 0.50
    c_dynamic_refresh_backup_vel: -0.06
    c_dynamic_refresh_settle_sec: 0.30
    c_wait_resume_recompute: true
    c_to_d_preempt_enable: true
    c_to_d_preempt_refresh_ge: 1
    c_to_d_preempt_path_rejected_ge: 1
    c_to_d_preempt_allow_cluster_jump: false
    c_to_d_preempt_force_cluster_jump: false

    cross_seg_close_origin_enable: true
    cross_seg_close_origin_progress_ratio: 0.55
    cross_seg_close_origin_remaining_m: 0.90
    defer_close_on_major_progress: true
    defer_close_progress_ratio: 0.55
    defer_close_remaining_m: 0.90
