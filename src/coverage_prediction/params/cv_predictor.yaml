cv_predictor:
  ros__parameters:
    tracks_topic: /coverage/obstacles/tracks
    pred_topic: /coverage/obstacles/predictions
    pred_markers_topic: /coverage/obstacles/pred_markers
    dt: 0.2
    horizon: 3.0
    marker_lifetime: 0.25

    # --- Upgraded predictor options (safe defaults) ---
    # Enable the per-track Kalman filter + Gaussian propagation (covariance visualized in RViz).
    enable_kf: true
    kf_meas_use_velocity: true

    # KF noise (tune if velocity looks too jittery or too sluggish)
    kf_sigma_meas_p: 0.12   # position measurement noise [m]
    kf_sigma_meas_v: 0.60   # velocity measurement noise [m/s]
    kf_sigma_a: 0.80        # process accel noise [m/s^2]

    # KF housekeeping
    kf_min_dt: 0.05
    kf_max_age: 0.70
    kf_init_sigma_p: 0.40
    kf_init_sigma_v: 0.80

    # Low-confidence velocity damping (for very new/unstable tracks)
    kf_vel_damping_conf0: 0.25
    kf_vel_damping_power: 1.0

    # --- static-map filter (prediction-level) ---
    # Drop tracks whose current position lies on the static map occupied cells (walls).
    use_map_filter: true
    map_topic: /map
    map_occ_thresh: 50
    map_pad_m: 0.15
    map_outside_is_occupied: true
    map_unknown_is_occupied: true
    map_filter_fail_open: true
    map_keep_if_speed_gt: 1.0
    map_use_track_radius: true
    map_track_radius_min_m: 0.55
    map_track_radius_cap_m: 2.0
    map_filter_debug: false
    map_filter_debug_period: 2.0

    # Visualization: confidence ellipses
    publish_ellipses: true
    ellipse_step: 6
    ellipse_points: 24
    ellipse_chi2: 5.991
    ellipse_inflate_radius: true
    ellipse_min_eig: 0.0001

    track_timeout_s: 0.45
