dynamic_obstacles:
  ros__parameters:
    scenario: agri_suite
    mode: low
    seed: 33
    bounds_source: plan
    bbox: [0.0, 0.0, 16.0, 12.0]
    edge_margin_m: 0.20

    obstacle_name_prefix: "microC"
    obstacle_speed_mps: 0.40

    suite_segment_indices: [0, 1, 2, 3]

    agri_crossing_num: 0
    agri_parallel_num: 0
    agri_blocking_num: 1
    agri_random_walk_num: 0

    agri_block_leave: false
    agri_block_dwell_min_sec: 9999.0
    agri_block_dwell_max_sec: 9999.0

    enable_wiggle: false
    gaussian_noise_std_m: 0.0
