# Example custom scenario file for coverage_sim dynamic_obstacles_node (scenario: yaml)
#
# Run with:
#   ros2 launch coverage_sim dynamic_obstacles.launch.py \
#     params_file:=<...> \
#     scenario:=yaml \
#     scenario_file:=<path-to-this-file>
#
# Tip: Keep start points on map edges to match the "edge spawn" assumption.

bbox: [0.0, 0.0, 40.0, 30.0]
edge_margin_m: 0.35
default_speed_mps: 0.55
default_loop: pingpong
default_pause_sec: [3.0, 8.0]

obstacles:
  # A) Crossing: bottom -> top (transient)
  - name: "yaml_cross_01"
    kind: line
    behavior: crossing
    anchor:
      segment: 10
      frac: 0.50
    speed_mps: 0.75
    size_profile: small
    loop: pingpong
    pause_start_sec: [8.0, 15.0]
    pause_end_sec:   [8.0, 15.0]
    wiggle_amp_m: 0.03
    wiggle_freq_hz: 0.25
    noise_std_m: 0.01

  # B) Parallel: moves along a coverage row
  - name: "yaml_parallel_01"
    kind: line
    behavior: parallel
    anchor:
      segment: 20
      frac: 0.20
    speed_mps: 0.30
    size_profile: human
    loop: pingpong
    pause_start_sec: [2.0, 4.0]
    pause_end_sec:   [2.0, 4.0]
    wiggle_amp_m: 0.04
    wiggle_freq_hz: 0.10
    noise_std_m: 0.01

  # C) Blocking: enters from edge and stays on the path (persistent)
  - name: "yaml_block_01"
    kind: line
    behavior: blocking
    anchor:
      segment: 6
      frac: 0.60
    speed_mps: 0.50
    size_profile: vehicle
    loop: stay
    pause_end_sec: [9999.0, 9999.0]
    wiggle_amp_m: 0.0
    wiggle_freq_hz: 0.0
    noise_std_m: 0.0

  # Explicit line (manual start/end)
  - name: "yaml_manual_line_01"
    kind: line
    behavior: line
    start: [0.35, 10.0]
    end:   [39.65, 10.0]
    speed_mps: 0.45
    size_xyz: [0.5, 0.5, 0.8]
    loop: pingpong
    pause_start_sec: [3.0, 6.0]
    pause_end_sec:   [3.0, 6.0]
    wiggle_axis: [0.0, 1.0]
    wiggle_amp_m: 0.03
    wiggle_freq_hz: 0.20
    noise_std_m: 0.01
