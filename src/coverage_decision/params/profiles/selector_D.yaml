strategy_selector:
  ros__parameters:
    robot_base_frame: base_footprint
    path_frame: map
    use_latest_tf: true
    corridor_radius: 0.9
    danger_radius: 0.2
    lookahead_dist: 5.0
    t_clear_max: 0.1
    t_block_defer: 999.0
    enable_yield: false
    enable_replan: true
    enable_skip: false
    tracks_topic: /coverage/obstacles/tracks
    use_map_filter: true
    map_topic: /map
    map_occ_thresh: 50
    map_pad_m: 0.3
    map_filter_min_overlap: 0.25
    map_filter_first_n_points: 10
    velocity_estimation_points: 4
    moving_speed_thresh: 0.18
    moving_recent_sec: 1.00
    quasi_static_speed_thresh: 0.06
    quasi_static_hold_sec: 1.00
    c_conflict_persist_sec: 0.80
    c_confidence_min: 0.35
    dynamic_wait_t_clear_max: 1.8
    dynamic_conflicts_prefer_wait: true
    static_conflicts_prefer_c: true
    static_emergency_radius: 0.08
    static_large_radius_thresh: 0.30
    semantic_speed_ema_alpha: 0.35
    current_path_stale_sec: 3.0
    semantic_overlap_inflate_m: 0.18
    persistent_blocker_speed_thresh: 0.05
    persistent_blocker_hold_sec: 1.8
    persistent_blocker_overlap_m: 0.80
    persistent_blocker_force_d_overlap_m: 1.60
    persistent_blocker_min_confidence: 0.30
