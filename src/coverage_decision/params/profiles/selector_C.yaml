strategy_selector:
  ros__parameters:
    robot_base_frame: base_footprint
    path_frame: map
    use_latest_tf: true
    corridor_radius: 0.9
    danger_radius: 0.2
    lookahead_dist: 5.0
    use_map_filter: true
    map_topic: /map
    map_occ_thresh: 50
    map_pad_m: 0.3
    map_filter_min_overlap: 0.25
    map_filter_first_n_points: 10
    t_clear_max: 0.2
    t_block_defer: 4.0
    enable_yield: false
    enable_replan: false
    enable_skip: false
