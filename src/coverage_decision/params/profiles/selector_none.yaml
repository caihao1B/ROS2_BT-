strategy_selector:
  ros__parameters:
    pred_topic: /coverage/obstacles/predictions
    path_topic: /coverage/current_path
    decision_topic: /coverage/strategy_decision
    robot_base_frame: base_link
    path_frame: map
    use_latest_tf: true
    corridor_radius: 0.001
    danger_radius: 0.0
    lookahead_dist: 5.0
    t_clear_max: 0.0
    t_block_defer: 999.0
    enable_yield: false
    enable_replan: false
    enable_skip: false
