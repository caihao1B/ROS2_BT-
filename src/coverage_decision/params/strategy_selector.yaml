strategy_selector:
  ros__parameters:
    pred_topic: /coverage/obstacles/predictions
    decision_topic: /coverage/strategy_decision
    coverage_path_topic: /coverage/current_path

    robot_base_frame: base_link
    path_frame: map
    use_latest_tf: true

    corridor_radius: 0.60
    danger_radius: 0.55
    lookahead_dist: 5.0

    t_clear_max: 4.0
    t_block_defer: 4.0

    enable_yield: true
    yield_angle_deg: 45.0
    yield_slowdown_ratio: 0.45

    enable_replan: true
