scan_tracker:
  ros__parameters:
    scan_topic: /scan
    output_frame: odom
    tracks_topic: /coverage/obstacles/tracks
    markers_topic: /coverage/obstacles/markers
    cluster_markers_topic: /coverage/obstacles/cluster_markers

    min_range: 0.05
    max_range: 6.0

    cluster_dist_base: 0.10
    cluster_dist_scale: 0.03
    min_cluster_size: 3
    max_cluster_size: 60

    match_dist: 0.60
    track_timeout: 0.35
    vel_alpha: 0.70
    pos_alpha: 0.20
    min_dt: 0.05

    cls_small_r: 0.25
    cls_medium_r: 0.55

    marker_lifetime: 0.20
    publish_clusters: true
